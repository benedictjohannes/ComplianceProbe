name: CI Test

on:
  push:
    branches:
      - next-gha-test

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y zsh
          cd webui && npm ci

      - name: Run tests
        run: make test

      - name: Build all binaries
        run: |
          make build
          make build-builder

      - name: Run E2E Tests
        run: make test-e2e

      - name: Generate Schema
        run: make schema

      - name: Upload Schema Artifact
        uses: actions/upload-artifact@v4
        with:
          name: playbook.schema.json
          path: playbook.schema.json
          retention-days: 30

      - name: Upload crobe-linux
        uses: actions/upload-artifact@v4
        with:
          name: crobe-linux
          path: |
            crobe-linux
            playbook.schema.json
          retention-days: 30

      - name: Upload crobe-windows
        uses: actions/upload-artifact@v4
        with:
          name: crobe-windows
          path: |
            crobe-windows.exe
            playbook.schema.json
          retention-days: 30

      - name: Upload crobe-mac-intel
        uses: actions/upload-artifact@v4
        with:
          name: crobe-mac-intel
          path: |
            crobe-mac-intel
            playbook.schema.json
          retention-days: 30

      - name: Upload crobe-mac-arm
        uses: actions/upload-artifact@v4
        with:
          name: crobe-mac-arm
          path: |
            crobe-mac-arm
            playbook.schema.json
          retention-days: 30

      - name: Upload crobe-builder-linux
        uses: actions/upload-artifact@v4
        with:
          name: crobe-builder-linux
          path: |
            crobe-builder-linux
            playbook.schema.json
          retention-days: 30

      - name: Upload crobe-builder-windows
        uses: actions/upload-artifact@v4
        with:
          name: crobe-builder-windows
          path: |
            crobe-builder-windows.exe
            playbook.schema.json
          retention-days: 30

      - name: Upload crobe-builder-mac-intel
        uses: actions/upload-artifact@v4
        with:
          name: crobe-builder-mac-intel
          path: |
            crobe-builder-mac-intel
            playbook.schema.json
          retention-days: 30

      - name: Upload crobe-builder-mac-arm
        uses: actions/upload-artifact@v4
        with:
          name: crobe-builder-mac-arm
          path: |
            crobe-builder-mac-arm
            playbook.schema.json
          retention-days: 30